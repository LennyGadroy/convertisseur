<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur Universel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/conv.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <svg class="illustration-top-left" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zM11 7h2v6h-2zm0 8h2v2h-2z"/>
    </svg>

    <svg class="illustration-bottom-right" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>

    <button id="theme-toggle" onclick="toggleTheme()">
        <span class="theme-icon"></span> <span></span>
    </button>

    <div class="container">
        <h1><i class="fas fa-sync-alt"></i> Convertisseur Universel</h1>

        <div class="input-group">
            <h3>Décimal en Binaire</h3>
            <input type="number" id="inputDecimal" placeholder="Entrez un nombre décimal" oninput="convertirDecimalEnBinaire()">
            <button onclick="convertirDecimalEnBinaire()"><i class="fas fa-arrow-right"></i> Convertir</button>
            <div id="resultatBinaire" class="result"></div>
        </div>

        <hr>

        <div class="input-group">
            <h3>Binaire en Décimal</h3>
            <input type="text" id="inputBinaire" placeholder="Entrez un nombre binaire" oninput="convertirBinaireEnDecimal()">
            <button onclick="convertirBinaireEnDecimal()"><i class="fas fa-arrow-right"></i> Convertir</button>
            <div id="resultatDecimal" class="result"></div>
        </div>
    </div>
    <script src="assets/conv.js"></script>
</body>
</html>
